<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pago cancelado</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #09090B;
    --card:    #18181B;
    --border:  rgba(255,255,255,.08);
    --text:    #FAFAFA;
    --muted:   #A1A1AA;
    --red:     #EF4444;
    --red2:    #FCA5A5;
    --gold:    #F59E0B;
    --gold2:   #FCD34D;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none; z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    text-align: center;
  }

  /* ── X animada ── */
  .x-wrap {
    width: 80px; height: 80px;
    margin: 0 auto 2rem;
  }
  .x-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid rgba(239,68,68,.2);
    background: rgba(239,68,68,.07);
    display: grid; place-items: center;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .x-ring svg {
    width: 32px; height: 32px;
    stroke: var(--red);
    stroke-width: 2.5;
    stroke-linecap: round;
    fill: none;
  }
  .x-ring svg line {
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
  }
  .x-ring svg line:nth-child(1) { animation: drawLine .3s ease .35s forwards; }
  .x-ring svg line:nth-child(2) { animation: drawLine .3s ease .5s forwards; }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -.03em;
    margin-bottom: .6rem;
    animation: fadeUp .5s ease .2s both;
  }
  .subtitle {
    font-size: .9rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 2rem;
    animation: fadeUp .5s ease .3s both;
  }

  /* ── Nota informativa ── */
  .info-box {
    background: rgba(245,158,11,.05);
    border: 1px solid rgba(245,158,11,.15);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    font-size: .85rem;
    color: var(--muted);
    line-height: 1.6;
    text-align: left;
    animation: fadeUp .5s ease .4s both;
  }
  .info-box strong { color: var(--gold2); font-weight: 500; }

  /* ── Botones ── */
  .actions {
    display: flex;
    flex-direction: column;
    gap: .75rem;
    animation: fadeUp .5s ease .5s both;
  }

  .btn-retry {
    background: var(--gold);
    border: none;
    border-radius: 10px;
    color: #09090B;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: .9rem;
    font-weight: 700;
    padding: .8rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    transition: background .18s, box-shadow .18s;
  }
  .btn-retry:hover { background: var(--gold2); box-shadow: 0 0 24px rgba(245,158,11,.25); }
  .btn-retry::after { content: '→'; }

  .btn-back {
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: .875rem;
    font-weight: 500;
    padding: .75rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    transition: background .18s, color .18s;
  }
  .btn-back:hover { background: rgba(255,255,255,.09); color: var(--text); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="x-wrap">
    <div class="x-ring">
      <svg viewBox="0 0 24 24">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </div>
  </div>

  <h1>Pago cancelado</h1>
  <p class="subtitle">No se realizó ningún cobro.<br>Puedes intentarlo de nuevo cuando quieras.</p>

  <div class="info-box">
    <strong>¿Tuviste un problema?</strong> Si el pago falló por error, intenta con otra tarjeta o verifica que los datos sean correctos. Tu información nunca fue guardada.
  </div>

  <div class="actions">
    <a href="/" class="btn-retry">Intentar de nuevo</a>
    <a href="/" class="btn-back">Volver al inicio</a>
  </div>

</div>
</body>
</html>
