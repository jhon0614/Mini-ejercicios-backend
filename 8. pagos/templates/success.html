<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>¡Pago exitoso!</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #09090B;
    --card:    #18181B;
    --border:  rgba(255,255,255,.08);
    --text:    #FAFAFA;
    --muted:   #A1A1AA;
    --green:   #22C55E;
    --green2:  #86EFAC;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none; z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    text-align: center;
  }

  /* ── Checkmark animado ── */
  .check-wrap {
    width: 80px; height: 80px;
    margin: 0 auto 2rem;
    position: relative;
  }
  .check-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid rgba(34,197,94,.25);
    background: rgba(34,197,94,.08);
    display: grid; place-items: center;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .check-ring svg {
    width: 36px; height: 36px;
    stroke: var(--green);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  .check-ring svg path {
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: drawCheck .4s ease .35s forwards;
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -.03em;
    margin-bottom: .6rem;
    animation: fadeUp .5s ease .2s both;
  }
  .subtitle {
    font-size: .9rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 2rem;
    animation: fadeUp .5s ease .3s both;
  }

  /* ── Card con detalles ── */
  .detail-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    text-align: left;
    animation: fadeUp .5s ease .4s both;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .6rem 0;
    font-size: .875rem;
    border-bottom: 1px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row span:first-child { color: var(--muted); }
  .detail-row span:last-child  { font-weight: 500; }
  .status-pill {
    background: rgba(34,197,94,.1);
    border: 1px solid rgba(34,197,94,.2);
    border-radius: 20px;
    color: var(--green2);
    font-size: .75rem;
    font-weight: 500;
    padding: .2rem .65rem;
  }

  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: .875rem;
    font-weight: 500;
    padding: .65rem 1.25rem;
    text-decoration: none;
    transition: background .18s, color .18s;
    animation: fadeUp .5s ease .5s both;
  }
  .btn-back:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .btn-back::before { content: '←'; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="check-wrap">
    <div class="check-ring">
      <svg viewBox="0 0 24 24">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
  </div>

  <h1>¡Pago exitoso!</h1>
  <p class="subtitle">Tu compra fue procesada correctamente.<br>Revisa tu correo para acceder al curso.</p>

  <div class="detail-card">
    <div class="detail-row">
      <span>Producto</span>
      <span>Curso Python Profesional</span>
    </div>
    <div class="detail-row">
      <span>Monto</span>
      <span>$10.00 USD</span>
    </div>
    <div class="detail-row">
      <span>Estado</span>
      <span class="status-pill">Aprobado</span>
    </div>
  </div>

  <a href="/" class="btn-back">Volver al inicio</a>

</div>
</body>
</html>
