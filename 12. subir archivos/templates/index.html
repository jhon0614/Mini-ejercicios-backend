<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir archivo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem; }

    /* Drop zone */
    .drop-zone {
      border: 1.5px dashed #ccc;
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.over {
      border-color: #378ADD;
      background: #f0f7ff;
    }
    .drop-zone svg { display: block; margin: 0 auto 12px; color: #888; }
    .drop-zone p { font-size: 15px; color: #555; margin-bottom: 4px; }
    .drop-zone span { font-size: 13px; color: #999; }
    input[type="file"] { display: none; }

    /* Tipos permitidos */
    .types { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .badge {
      font-size: 11px; padding: 3px 8px;
      border-radius: 4px; border: 1px solid #e0e0e0;
      background: #f7f7f5; color: #666;
    }

    /* File info */
    .file-info {
      display: none; align-items: center; gap: 12px;
      margin-top: 1rem; padding: 12px 14px;
      border: 1px solid #eee; border-radius: 10px;
      background: #fafafa;
    }
    .file-name { flex: 1; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { font-size: 12px; color: #999; }
    .remove-btn {
      background: none; border: none; cursor: pointer;
      color: #aaa; font-size: 18px; line-height: 1; padding: 2px;
    }
    .remove-btn:hover { color: #333; }

    /* Progress */
    .progress-wrap {
      display: none; margin-top: 1rem;
      height: 4px; background: #eee;
      border-radius: 4px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: #378ADD; border-radius: 4px;
      transition: width .2s;
    }

    /* Messages */
    .msg { display: none; margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    .msg.ok { background: #edfaf3; color: #1a7a45; border: 1px solid #b4e8cc; }
    .msg.err { background: #fef0f0; color: #a33; border: 1px solid #f5bcbc; }

    /* Button */
    .submit-btn {
      margin-top: 1.25rem; width: 100%;
      padding: 11px; border-radius: 10px;
      border: 1px solid #ddd; background: #fff;
      font-size: 15px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }
    .submit-btn:hover { background: #f5f5f3; }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="card">
  <h1>Subir archivo</h1>

  <div class="drop-zone" id="dropZone">
    <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 12V4m0 0L8 8m4-4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p>Arrastra tu archivo aquí</p>
    <span>o haz clic para seleccionar</span>
    <input type="file" id="fileInput" name="archivo" accept=".png,.jpg,.jpeg,.pdf">
  </div>

  <div class="types">
    <span class="badge">PNG</span>
    <span class="badge">JPG</span>
    <span class="badge">JPEG</span>
    <span class="badge">PDF</span>
    <span class="badge">Máx. 10 MB</span>
  </div>

  <div class="file-info" id="fileInfo">
    <svg width="22" height="22" fill="none" stroke="#555" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="14 2 14 8 20 8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="flex:1;min-width:0">
      <div class="file-name" id="fileName"></div>
      <div class="file-size" id="fileSize"></div>
    </div>
    <button class="remove-btn" id="removeBtn" title="Quitar">&#x2715;</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="msg" id="msg"></div>

  <button class="submit-btn" id="submitBtn" disabled>Subir archivo</button>
</div>

<script>
  const drop = document.getElementById('dropZone');
  const input = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const fileName = document.getElementById('fileName');
  const fileSize = document.getElementById('fileSize');
  const removeBtn = document.getElementById('removeBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');
  let selectedFile = null;

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function setFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = fmtSize(file.size);
    fileInfo.style.display = 'flex';
    submitBtn.disabled = false;
    msg.style.display = 'none';
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
  }

  function clearFile() {
    selectedFile = null;
    input.value = '';
    fileInfo.style.display = 'none';
    submitBtn.disabled = true;
    msg.style.display = 'none';
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
  }

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', () => { if (input.files[0]) setFile(input.files[0]); });
  removeBtn.addEventListener('click', clearFile);

  submitBtn.addEventListener('click', () => {
    if (!selectedFile) return;
    const fd = new FormData();
    fd.append('archivo', selectedFile);

    submitBtn.disabled = true;
    progressWrap.style.display = 'block';
    msg.style.display = 'none';

    const xhr = new XMLHttpRequest();
    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        progressBar.style.width = Math.round(e.loaded / e.total * 100) + '%';
      }
    });
    xhr.addEventListener('load', () => {
      progressBar.style.width = '100%';
      try {
        const data = JSON.parse(xhr.responseText);
        if (xhr.status >= 200 && xhr.status < 300) {
          msg.className = 'msg ok';
          msg.textContent = data.message || 'Archivo subido correctamente';
          clearFile();
        } else {
          msg.className = 'msg err';
          msg.textContent = data.error || 'Error al subir el archivo';
          submitBtn.disabled = false;
        }
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = 'Error inesperado del servidor';
        submitBtn.disabled = false;
      }
      msg.style.display = 'block';
    });
    xhr.addEventListener('error', () => {
      msg.className = 'msg err';
      msg.textContent = 'No se pudo conectar con el servidor';
      msg.style.display = 'block';
      submitBtn.disabled = false;
    });
    xhr.open('POST', '/upload');
    xhr.send(fd);
  });
</script>
</body>
</html>
